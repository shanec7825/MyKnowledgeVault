<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>习惯是怎样形成的？· Huberman Lab 动画分镜</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070d1c;color:#edf8ff;font:16px/1.6 system-ui,'Microsoft YaHei',sans-serif;display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:28px}.wrap{width:min(1100px,100%)}h1{margin:0 0 12px;font-size:clamp(23px,3vw,38px)}.lead{margin:0 0 20px;color:#a8b5d6}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:17px;background:#101b30;border:1px solid #2f3d5d;box-shadow:0 20px 80px #0008}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .65s ease;transform:scale(1.01)}#incoming{opacity:0}.controls{display:flex;align-items:center;gap:10px;margin:15px 0}button{background:#1c2a45;color:#f1f7ff;border:1px solid #4a607e;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer}button:hover,button:focus-visible{background:#32456b;outline:2px solid #5ce5de}.counter{margin-left:auto;font-variant-numeric:tabular-nums;color:#a8b5d6}.track{height:5px;background:#26344f;border-radius:6px;overflow:hidden}.track i{display:block;width:0%;height:100%;background:linear-gradient(90deg,#5ce5de,#a8a0ff)}.tip{color:#a8b5d6;font-size:14px;margin-top:22px}a{color:#5ce5de}p{max-width:940px}@media(prefers-reduced-motion:reduce){.stage img{transition:none}.track i{transition:none}}</style></head><body><main class="wrap"><h1>习惯是怎样形成的？</h1><p class="lead">Andrew Huberman《The Science of Making & Breaking Habits》· 原创视觉科普分镜</p><div class="stage" aria-label="科普动画"><img id="current" src="frames/01.svg" alt="分镜 1"><img id="incoming" src="frames/02.svg" alt=""></div><div class="controls"><button id="prev" aria-label="上一张">← 上一张</button><button id="toggle" aria-label="暂停动画">暂停 Ⅱ</button><button id="next" aria-label="下一张">下一张 →</button><span id="counter" class="counter">01 / 10</span></div><div class="track"><i id="bar"></i></div><p class="tip">键盘 ← / → 切换，空格播放或暂停。图片为 SVG 矢量图，可单独下载。21 天方案仅为节目提出的练习框架，不是普遍有效的固定成习惯时长。完整配乐 MP4 在本次 ChatGPT 对话提供下载。</p><p class="tip">来源：<a href="https://www.youtube.com/watch?v=HXuj7wAt7u8" target="_blank" rel="noopener">Huberman Lab Essentials</a> · <a href="../../Clippings/The%20Science%20of%20Making%20%26%20Breaking%20Habits%20%20Huberman%20Lab%20Essentials.md">知识库原文</a></p></main>
<script>const frames=Array.from({length:10},(_,i)=>'frames/'+String(i+1).padStart(2,'0')+'.svg');let pos=0,playing=true,last=performance.now(),transition=false;const a=document.getElementById('current'),b=document.getElementById('incoming'),bar=document.getElementById('bar'),counter=document.getElementById('counter'),btn=document.getElementById('toggle'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function go(n){if(transition)return;let ix=(n+frames.length)%frames.length;if(ix===pos)return;transition=true;b.src=frames[ix];b.alt='分镜 '+(ix+1);b.style.opacity=1;const done=()=>{a.src=frames[ix];a.alt='分镜 '+(ix+1);b.style.transition='none';b.style.opacity=0;void b.offsetWidth;b.style.transition='opacity .65s ease';pos=ix;counter.textContent=String(ix+1).padStart(2,'0')+' / 10';last=performance.now();transition=false;};setTimeout(done,reduced?0:650);}document.getElementById('prev').onclick=()=>go(pos-1);document.getElementById('next').onclick=()=>go(pos+1);btn.onclick=()=>{playing=!playing;btn.textContent=playing?'暂停 Ⅱ':'播放 ▶';btn.setAttribute('aria-label',playing?'暂停动画':'播放动画');last=performance.now()};window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'){go(pos-1)}else if(e.code==='ArrowRight'){go(pos+1)}else if(e.code==='Space'){e.preventDefault();btn.click()}});function tick(t){let f=playing?Math.min(1,(t-last)/4600):0;bar.style.width=(f*100)+'%';if(playing&&f>=1&&!transition)go(pos+1);requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></body></html>
