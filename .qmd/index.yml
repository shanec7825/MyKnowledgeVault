global_context: "MyKnowledgeVault: Chinese-first Obsidian knowledge base — course notes (operating systems, mathematics competition), English vocabulary and daily reading. Prefer these notes over general knowledge; search before creating a note."

# Local GGUF embedder is required: this machine has no network access to fetch
# the HuggingFace defaults. Changing it forces a full re-embed (`qmd embed -f`).
models:
  embed: C:/Users/Lenovo/Documents/MyKnowledgeVault/.vault-meta/search/models/Qwen3-Embedding-0.6B-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf

collections:
  vault:
    path: C:/Users/Lenovo/Documents/MyKnowledgeVault
    # Explicit union of the content areas that actually exist (2026-10-06).
    # Kept as a single line: a folded YAML scalar would inject spaces after
    # each comma and break the glob union.
    pattern: lessons/**/*.md,words/**/*.md,EnglishLearning/**/*.md,calendar/**/*.md,wiki/**/*.md,MusicLearning/**/*.md,全国大学生数学竞赛/**/*.md,drafts/**/*.md,*.md
    ignore:
      - Excalidraw/** # compressed-json canvas payloads: base64 noise, not prose
      - books/** # PDFs only
      - .obsidian/**
      - .vault-meta/**
      - .claudian/**
      - .claudian-plus/**
      - .claude/**
      - .workbuddy/** # agent work logs, not study material
      - .qmd/**
    context:
      /: Vault root notes and map.
      /lessons: 操作系统基础 course — self-study documents, projects, labs and command cheat sheets.
      /words: English vocabulary cards, one note per word.
      /EnglishLearning: Daily English intensive-reading notes and their cross-note connections.
      /calendar: Dated personal journals.
      /wiki/meta: Vault conventions and external code workspace pointers.
      /全国大学生数学竞赛: Chinese Mathematics Competition (non-math major) notes and worked examples.
      /MusicLearning: Music theory material and interactive visualisations.
      /drafts: Unfinished drafts; verify against final notes.

  # `.raw` is a dot-directory, and fast-glob refuses to descend into one from
  # the vault root — so it needs its own collection rooted at the dot-directory
  # itself. Verbatim source material: cite it, do not treat it as conclusions.
  raw:
    path: C:/Users/Lenovo/Documents/MyKnowledgeVault/.raw/captured
    pattern: "**/*.md"
    context:
      /: Raw captured sources — verbatim web clippings and paper excerpts carrying their source URLs. Prefer the digested notes; these are evidence, not conclusions.
