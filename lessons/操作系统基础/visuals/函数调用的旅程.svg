<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">函数 add 的调用与返回</title><desc id="d">main 调用 add 传入 2 和 3，add 计算 5 并返回给 main</desc><rect width="1000" height="300" rx="22" fill="#f8fafc"/>
<text x="40" y="45" font-family="system-ui,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">调用函数，就像暂时委托一项计算，再拿回结果</text>
<rect x="42" y="91" width="244" height="140" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="164" y="137" font-family="monospace" font-size="26" fill="#1d4ed8" text-anchor="middle">main()</text><text x="164" y="177" font-family="monospace" font-size="21" fill="#1e3a8a" text-anchor="middle">add(2, 3)</text>
<path d="M296 132 H700" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M686 122 L704 132 L686 142" fill="none" stroke="#64748b" stroke-width="4"/><text x="498" y="113" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#475569">传入两个参数</text>
<rect x="710" y="91" width="247" height="140" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="834" y="137" font-family="monospace" font-size="26" fill="#166534" text-anchor="middle">add(a, b)</text><text x="834" y="177" font-family="monospace" font-size="22" fill="#166534" text-anchor="middle">2 + 3 = 5</text>
<path d="M700 205 H296" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/><path d="M312 195 L294 205 L312 215" fill="none" stroke="#ea580c" stroke-width="4"/><text x="498" y="237" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#9a3412">返回结果 5，main 继续执行</text><text x="40" y="280" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">下一层再研究寄存器（rdi、rsi、rax）、call / ret 和返回地址。</text></svg>