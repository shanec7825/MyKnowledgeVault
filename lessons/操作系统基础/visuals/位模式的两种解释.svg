<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
<title id="t">八位二进制数的两种解释</title><desc id="d">八个 1 保持不变，作为无符号整数是 255，作为八位补码整数是负 1</desc><rect width="1000" height="340" rx="22" fill="#f8fafc"/>
<text x="42" y="47" font-family="system-ui,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">同样的 8 位，不同的解释规则</text>
<g font-family="monospace" text-anchor="middle" font-size="36" font-weight="bold">
<rect x="44" y="84" rx="12" width="108" height="90" fill="#fee2e2" stroke="#f87171"/><text x="98" y="142" fill="#991b1b">1</text>
<rect x="160" y="84" rx="12" width="108" height="90" fill="#dbeafe" stroke="#60a5fa"/><text x="214" y="142" fill="#1d4ed8">1</text>
<rect x="276" y="84" rx="12" width="108" height="90" fill="#dbeafe" stroke="#60a5fa"/><text x="330" y="142" fill="#1d4ed8">1</text>
<rect x="392" y="84" rx="12" width="108" height="90" fill="#dbeafe" stroke="#60a5fa"/><text x="446" y="142" fill="#1d4ed8">1</text>
<rect x="508" y="84" rx="12" width="108" height="90" fill="#dbeafe" stroke="#60a5fa"/><text x="562" y="142" fill="#1d4ed8">1</text>
<rect x="624" y="84" rx="12" width="108" height="90" fill="#dbeafe" stroke="#60a5fa"/><text x="678" y="142" fill="#1d4ed8">1</text>
<rect x="740" y="84" rx="12" width="108" height="90" fill="#dbeafe" stroke="#60a5fa"/><text x="794" y="142" fill="#1d4ed8">1</text>
<rect x="856" y="84" rx="12" width="100" height="90" fill="#dbeafe" stroke="#60a5fa"/><text x="906" y="142" fill="#1d4ed8">1</text>
</g><g font-family="system-ui,sans-serif" font-size="19" fill="#334155"><text x="44" y="207">无符号：最高位权重 +128，结果</text><text x="560" y="207" font-weight="bold" fill="#1d4ed8" font-size="30">255</text>
<text x="44" y="260">8 位补码：最高位权重 −128，结果</text><text x="560" y="260" font-weight="bold" fill="#b45309" font-size="30">−1</text>
<text x="44" y="311" font-size="17" fill="#64748b">注意：字节没有改变。这里是数学上的解释；C 类型转换规则需要另外学习。</text></g></svg>