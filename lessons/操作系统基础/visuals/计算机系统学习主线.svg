<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">计算机系统基础五阶段学习地图</title><desc id="desc">从源文件和编译到位模式、CPU与机器级程序、进程与内存、文件与网络，并最终连接成小型服务器。建议先从项目0开始。</desc>
